<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>첫 직장, 10년 뒤 경제력</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css?v=20261123f">
  <link rel="icon" href="data:,">
</head>
<body>
<header class="top">
  <div class="wrap topbar">
    <div class="brand">
      <h1 class="mark"><span class="mark-logo" aria-hidden="true"></span>첫 직장, 10년 뒤 경제력</h1>
      <p class="brand-sub">채용공고 두 개를 넣으면 세금과 월세를 빼고 10년 동안 남는 돈을 비교합니다.</p>
    </div>
    <ol class="stepper" id="stepper" aria-label="진행 단계">
      <li data-step="1" class="on"><span>1</span> 입력</li>
      <li data-step="2"><span>2</span> 확인</li>
      <li data-step="3"><span>3</span> 결과</li>
    </ol>
  </div>
</header>

<main class="wrap">
  <!-- 1 입력 -->
  <section id="step1" class="step">
    <div class="hero" id="hero">
      <div class="hero-copy">
        <h2 class="hero-title">10년 뒤,<br>얼마나 남을까요?</h2>
        <p class="hero-lead">두 채용공고의 세후 급여에서 월세를 빼고, 실제로 남는 돈을 비교해 보세요.</p>
        <div class="hero-cta">
          <button type="button" class="primary" id="heroOwn">공고 비교하기</button>
          <button type="button" class="ghost" id="heroTry">샘플 결과 보기</button>
        </div>
        <section class="hero-receipt" id="heroReceipt" aria-label="샘플 비교 결과 미리보기" hidden>
          <div id="heroFact"></div>
          <p class="hero-note" id="heroNote"></p>
        </section>
      </div>
      <div class="hero-stage">
        <div class="hero-shot" aria-hidden="true">
          <video id="heroVideo" muted playsinline preload="auto" disablepictureinpicture disableremoteplayback poster="img/hero_print_poster.webp?v=2">
            <source src="img/hero_print.mp4?v=2" type="video/mp4">
          </video>
        </div>
        <button type="button" class="hero-replay" id="heroReplay">다시 출력</button>
      </div>
    </div>
    <div class="card">
      <h2>공고 두 건</h2>
      <p class="hint">이름과 연락처는 지우고 붙여 넣어 주세요.</p>
      <div id="samples" class="samples">
        <span class="small">샘플</span>
        <span id="sampleButtons"></span>
      </div>
      <div class="two">
        <div class="field post">
          <div class="post-paper" id="paperA">
            <label for="textA" class="rc-title">공고 A</label>
            <div class="rc-center rc-note" aria-hidden="true">붙여 넣은 채용공고</div>
            <div class="rc-rule" aria-hidden="true"></div>
            <div class="post-view" id="viewA" role="button" tabindex="0" aria-label="공고 A 고치기" hidden></div>
            <textarea id="textA" rows="12" maxlength="8000" placeholder="채용공고 본문을 붙여 넣어 주세요"></textarea>
            <div class="rc-rule" aria-hidden="true"></div>
            <div class="post-foot"><span>글자 수</span><span class="count"><span id="countA">0</span> / 8,000자</span></div>
          </div>
        </div>
        <div class="field post">
          <div class="post-paper" id="paperB">
            <label for="textB" class="rc-title">공고 B</label>
            <div class="rc-center rc-note" aria-hidden="true">붙여 넣은 채용공고</div>
            <div class="rc-rule" aria-hidden="true"></div>
            <div class="post-view" id="viewB" role="button" tabindex="0" aria-label="공고 B 고치기" hidden></div>
            <textarea id="textB" rows="12" maxlength="8000" placeholder="채용공고 본문을 붙여 넣어 주세요"></textarea>
            <div class="rc-rule" aria-hidden="true"></div>
            <div class="post-foot"><span>글자 수</span><span class="count"><span id="countB">0</span> / 8,000자</span></div>
          </div>
        </div>
      </div>
      <div id="msg1" class="msg" role="alert" hidden></div>
      <div id="busy1" class="busy" hidden><span class="spin"></span><span class="busytext"></span></div>
      <div class="actions"><button id="btnStart" class="primary" type="button">비교 시작</button></div>
    </div>
  </section>

  <!-- 2 확인 -->
  <section id="step2" class="step" hidden>
    <div id="confirmBody"></div>
    <div id="msg2" class="msg" role="alert" hidden></div>
    <div id="busy2" class="busy" hidden><span class="spin"></span><span class="busytext"></span></div>
    <div class="actions">
      <button id="btnBack1" class="ghost" type="button">입력으로</button>
      <button id="btnCalc" class="primary" type="button">계산</button>
    </div>
  </section>

  <!-- 3 결과 -->
  <section id="step3" class="step" hidden>
    <div id="resultBody"></div>
    <div id="msg3" class="msg" role="alert" hidden></div>
    <div id="busy3" class="busy" hidden><span class="spin"></span><span class="busytext"></span></div>
    <div class="actions">
      <button id="btnBack2" class="ghost" type="button">확인 화면으로</button>
      <button id="btnReset" class="ghost" type="button">처음부터</button>
    </div>
  </section>
</main>

<footer class="wrap foot">
  <p>계산 결과는 입력한 값과 가정에 따른 참고용 수치이며, 세무·법률 자문이 아닙니다.</p>
</footer>

<script src="flow.js?v=20261121zg"></script>
<script src="app.js?v=20261122a"></script>
<script src="hero.js?v=20261123d"></script>
</body>
</html>
